services:
  db:
    image: postgres:17-alpine
    container_name: stakemap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-stakemap_db}
    ports:
      # Gunakan 5432:5432. Ubah sisi kiri (misal "5433:5432") jika port 5432 lokal sudah terpakai
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: