services:
  postgres:
    image: postgres:17-alpine
    container_name: stakemap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-stakemap_db}
    ports:
      - '${DATABASE_PORT:-5435}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USERNAME:-admin} -d ${DATABASE_NAME:-stakemap_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
